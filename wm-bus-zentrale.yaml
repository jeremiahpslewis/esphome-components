# M5Stack Unit C6L (U202) -- Sensus PolluCom F wireless M-Bus / OMS

esphome:
  name: wm-bus-zentrale
  friendly_name: wM-Bus Zentrale
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32c6
  framework:
    type: esp-idf
    advanced:
      # Telegrams are decoded in the main loop; the 8 KB default is too small
      loop_task_stack_size: 32768

external_components:
  - source: github://jeremiahpslewis/esphome-components@main
    components: [wmbus_radio, wmbus_meter, wmbus_common]
    refresh: always

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  encryption:
    key: !secret wm_bus_zentrale__encryption_key

ota:
  - platform: esphome
    password: !secret wm_bus_zentrale__ota_password

time:
  - platform: homeassistant
    id: ha_time

i2c:
  id: internal_i2c
  sda: GPIO10
  scl:
    number: GPIO8
    ignore_strapping_warning: true
  scan: true

pi4ioe5v6408:
  - id: c6l_io
    i2c_id: internal_i2c
    address: 0x43

switch:
  - platform: gpio
    id: radio_lna_enable
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      pi4ioe5v6408: c6l_io
      number: 5
      mode: OUTPUT

  - platform: gpio
    id: radio_antenna_enable
    internal: true
    restore_mode: ALWAYS_ON
    pin:
      pi4ioe5v6408: c6l_io
      number: 6
      mode: OUTPUT

  - platform: gpio
    id: oled_cs_inactive
    internal: true
    restore_mode: ALWAYS_ON
    pin: GPIO6

spi:
  clk_pin: GPIO20
  mosi_pin: GPIO21
  miso_pin: GPIO22

wmbus_radio:
  radio_type: SX1262
  setup_priority: 500
  cs_pin: GPIO23
  irq_pin: GPIO7
  busy_pin: GPIO19

  reset_pin:
    pi4ioe5v6408: c6l_io
    number: 7
    mode: OUTPUT

  rx_gain: BOOSTED
  rf_switch: true
  has_tcxo: true

  on_frame:
    - then:
        - logger.log:
            format: "wM-Bus RSSI=%d dBm frame=%s"
            args: ['frame->rssi()', 'frame->as_hex().c_str()']

# ---------------------------------------------------------------------------
# wM-Bus meters
# ---------------------------------------------------------------------------

# meter_id must be written with a 0x prefix (e.g. 0x12345678), a bare number
# is read as decimal
wmbus_meter:
  - id: elw_meter
    meter_id: !secret heat_meter_1_id
    type: pollucomf
    key: !secret heat_meter_1_key
    mode:
      - T1
      - C1

  - id: main_meter
    meter_id: !secret heat_meter_2_id
    type: pollucomf
    key: !secret heat_meter_2_key
    mode:
      - T1
      - C1

# ---------------------------------------------------------------------------
# Sensors
# ---------------------------------------------------------------------------

sensor:

  # =========================
  # ELW
  # =========================

  - platform: wmbus_meter
    parent_id: elw_meter
    id: elw_energy
    name: "ELW Waermemenge"
    field: total_kwh
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: elw_meter
    id: elw_volume
    name: "ELW Volumen"
    field: total_m3
    unit_of_measurement: m³
    device_class: volume
    state_class: total_increasing
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: elw_meter
    id: elw_power
    name: "ELW Waermeleistung"
    field: power_kw
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: elw_meter
    id: elw_flow
    name: "ELW Durchfluss"
    field: flow_m3h
    unit_of_measurement: m³/h
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: elw_meter
    id: elw_forward_temp
    name: "ELW Vorlauf"
    field: forward_c
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: wmbus_meter
    parent_id: elw_meter
    id: elw_return_temp
    name: "ELW Ruecklauf"
    field: return_c
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: wmbus_meter
    parent_id: elw_meter
    id: elw_rssi
    name: "ELW Funksignal"
    field: rssi_dbm
    unit_of_measurement: dBm
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic

  # =========================
  # Main
  # =========================

  - platform: wmbus_meter
    parent_id: main_meter
    id: main_energy
    name: "Main Waermemenge"
    field: total_kwh
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: main_meter
    id: main_volume
    name: "Main Volumen"
    field: total_m3
    unit_of_measurement: m³
    device_class: volume
    state_class: total_increasing
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: main_meter
    id: main_power
    name: "Main Waermeleistung"
    field: power_kw
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: main_meter
    id: main_flow
    name: "Main Durchfluss"
    field: flow_m3h
    unit_of_measurement: m³/h
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 3

  - platform: wmbus_meter
    parent_id: main_meter
    id: main_forward_temp
    name: "Main Vorlauf"
    field: forward_c
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: wmbus_meter
    parent_id: main_meter
    id: main_return_temp
    name: "Main Ruecklauf"
    field: return_c
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: wmbus_meter
    parent_id: main_meter
    id: main_rssi
    name: "Main Funksignal"
    field: rssi_dbm
    unit_of_measurement: dBm
    device_class: signal_strength
    state_class: measurement
    entity_category: diagnostic

# ---------------------------------------------------------------------------
# Status
# ---------------------------------------------------------------------------

text_sensor:
  - platform: wmbus_meter
    parent_id: elw_meter
    id: elw_status
    name: "ELW Status"
    field: status
    entity_category: diagnostic

  - platform: wmbus_meter
    parent_id: main_meter
    id: main_status
    name: "Main Status"
    field: status
    entity_category: diagnostic
